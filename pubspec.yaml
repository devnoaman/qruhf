name: qruhf
description: Native barcode and UHF RFID readers for Senter Android tablets, with typed scan streams and a complete example.
version: 0.1.0
homepage: https://devnoaman.web.app
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.qruhf.qruhf
        pluginClass: QruhfPlugin
